<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexus Logics – Live Demo</title>
<meta name="theme-color" content="#6d2fc0">
<style>
:root{--ac:#6d2fc0;--bg:#f5f3fa;--ink:#1b1535;--mut:#6b6485;--line:#e3ddf2;--card:#fff;--bad:#d6336c;--ok:#1e9e6a;--navy:#150f2b;--tc:#6d2fc0}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 Inter,"Noto Sans Sinhala","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:0}
input,select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%;min-width:0}
h2,h3,h4{margin:0}label{font-weight:700;font-size:13px;display:block;margin:12px 0 5px}
:focus-visible{outline:3px solid #ff6a1a;outline-offset:1px}
.btn{background:var(--tc);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;text-decoration:none;display:inline-block;min-height:40px}
.btn.alt{background:#fff;color:var(--tc);border:1.5px solid var(--tc)}.btn.ghost{background:#fff;color:var(--mut);border:1px solid var(--line)}.btn.sm{padding:5px 11px;font-size:13px;min-height:34px}.btn.bad{background:var(--bad)}.btn.ok{background:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.mut{color:var(--mut)}.r{text-align:right}.bad{color:var(--bad)}.ok{color:var(--ok)}
.tag{border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}.tag.g{background:#ddf5ea;color:#14744d}.tag.r{background:#ffe0ea;color:#b0204f}.tag.y{background:#fff1c9;color:#8a6200}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 80% 10%,#3a1b8c,#150f2b 55%,#110a2c)}
.lcard{background:#fff;border-radius:20px;padding:24px;max-width:660px;width:100%}.lcard img{height:70px;border-radius:8px}
.pill{display:inline-block;background:#ffe9a8;color:#6b4a00;border-radius:99px;padding:3px 11px;font-size:12px;font-weight:700;margin-left:8px}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0}
.type{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-weight:600;font-size:13.5px;color:var(--ink)}.type i{display:block;font-style:normal;font-size:28px;margin-bottom:4px}.type.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 11%,#fff)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo{background:linear-gradient(90deg,#7b2fbf,#d6336c);color:#fff;font-size:13px;padding:7px 14px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.demo .btn{background:#fff;color:#7b2fbf;padding:4px 11px;min-height:30px;font-size:12.5px}.dbt{display:flex;gap:6px;flex-wrap:wrap}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 38px)}
.side{background:var(--navy);color:#fff;padding:14px 10px;position:sticky;top:0;height:calc(100vh - 38px);overflow:auto}
.brand{padding:4px 8px 12px;font-weight:800;line-height:1.2}.brand small{display:block;color:#b8aee0;font-weight:500;margin-top:2px}
.nv{display:flex;gap:10px;align-items:center;width:100%;background:transparent;color:#d9d2f2;padding:11px 12px;border-radius:10px;text-align:left;font-weight:600;margin-bottom:3px}.nv.on{background:var(--tc);color:#fff}
.main{padding:16px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:color-mix(in srgb,var(--tc) 14%,#fff);color:var(--tc);border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:700}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px}.kpi{margin:0;border-left:5px solid var(--tc)}.kpi small{color:var(--mut);font-weight:600}.kpi div{font-size:22px;font-weight:800;margin-top:3px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}.bar{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bar i{display:block;background:var(--tc);border-radius:7px 7px 0 0;min-height:4px}.bar b{color:var(--ink);font-size:10.5px}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mut);font-size:12px;padding:8px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.4px}td{padding:8px;border-bottom:1px solid #f0ecf8;vertical-align:middle}.tw{overflow-x:auto}
.pos{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:12px;align-items:start}.cartbox{position:sticky;top:8px;max-height:calc(100vh - 60px);overflow:auto}
.bar2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.bar2 input{flex:1;min-width:180px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.chips button{padding:6px 13px;border-radius:99px;background:#fff;border:1px solid var(--line);white-space:nowrap;font-weight:600;color:var(--ink)}.chips button.on{background:var(--tc);color:#fff;border-color:var(--tc)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
.tile{background:#fff;border:1px solid var(--line);border-top:4px solid var(--tc);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:96px;color:var(--ink)}.tile:hover{border-color:var(--tc)}.tile b{font-size:13.5px;line-height:1.25}.tile span{color:var(--tc);font-weight:800}.tile small{color:var(--mut)}.tile.out{opacity:.45;pointer-events:none}
.ln{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.ln .q{display:flex;gap:3px;align-items:center}.ln .q input{width:54px;text-align:center;padding:5px}.ln .dis{width:62px;padding:5px}.ln .ctl{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tot>div{display:flex;justify-content:space-between;padding:3px 0}.tot .g{font-size:20px;font-weight:800;border-top:2px dashed var(--line);margin-top:4px;padding-top:6px}
.tbg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.tb{border-radius:14px;padding:14px 8px;text-align:center;font-weight:700;border:2px solid var(--line);background:#fff;color:var(--ink)}.tb.occ{border-color:#e67700;background:#fff4e0}.tb small{display:block;font-weight:500;color:var(--mut)}
.mw{position:fixed;inset:0;background:rgba(20,10,50,.55);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}.mb{background:#fff;border-radius:16px;padding:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.receipt{background:#fff;color:#111;font-size:13px;padding:14px;margin:0 auto;border:1px dashed #bbb}.receipt.r-80{width:76mm;font-size:12px}.receipt.r-a5{max-width:148mm}.receipt.r-a4{max-width:190mm}
.receipt .rh{text-align:center;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:6px}.receipt .rn{font-size:18px}.receipt table td,.receipt table th{padding:3px 2px;border:0}.receipt .rt{border-top:1px dashed #111;margin-top:6px;padding-top:4px}.receipt .rt div{display:flex;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1b1535;color:#fff;padding:9px 16px;border-radius:99px;z-index:70;font-weight:600}
.bnav,.cartbar{display:none}
@media(max-width:860px){.shell{display:block}.side{display:none}.two,.pos{grid-template-columns:1fr}.cartbox{position:static;max-height:none}.main{padding:12px 12px 130px}
.bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--navy);z-index:20;padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px));overflow-x:auto}.bnav button{flex:1;min-width:66px;background:transparent;color:#d9d2f2;font-size:11px;padding:6px 2px;border-radius:10px}.bnav button.on{background:var(--tc);color:#fff}.bnav i{display:block;font-style:normal;font-size:18px}
.cartbar{display:flex;position:fixed;left:10px;right:10px;bottom:64px;z-index:30;background:var(--tc);color:#fff;border-radius:14px;padding:11px 16px;justify-content:space-between;font-weight:700;box-shadow:0 4px 16px #0004}}
@media print{body *{visibility:hidden}.receipt,.receipt *{visibility:visible}.receipt{position:absolute;left:0;top:0;border:0;margin:0}}

function relOk(){const a=+$('ra').value;if(!(a>0))return;C().lines.push({name:'Reload – '+$('ro').value+' '+$('rn').value,price:a,cost:r2(a*.97),qty:1,disc:0,reload:1});closeM();cartR()}
function bill(c,type,no){const k=calc(c);return{no,date:ld(),time:pad(new Date().getHours(),2)+':'+pad(new Date().getMinutes(),2),cust:c.cust,mob:c.mob,lines:c.lines.map(l=>({...l})),sub:k.sub,da:k.da,sv:k.sv,total:k.tot,profit:k.profit,method:c.method,type,ctx:S.ctx,dt:c.dt,dv:c.dv}}
function pay(){const c=C();if(!c.lines.length)return toast('The cart is empty');const k=calc(c),paid=c.paid==null?k.tot:+c.paid,bal=r2(k.tot-paid);
 if((bal>0||c.method=='Credit')&&!c.cust.trim())return alert('Enter the customer name for a credit sale / balance.');
 const b=bill(c,'sale','INV-'+pad(S.n++));b.paid=paid;if(c.method=='Credit'&&paid>=k.tot)b.paid=0;
 const owe=r2(k.tot-b.paid);c.lines.forEach(l=>{const it=S.items.find(i=>i.id==l.id);if(it&&TRK(it))it.stock=r2(it.stock+(l.ret?1:-1)*l.qty)});
 if(owe>0){let u=S.customers.find(x=>x.name.toLowerCase()==c.cust.trim().toLowerCase());if(!u){u={name:c.cust.trim(),mob:c.mob,credit:0};S.customers.push(u)}u.credit=r2(u.credit+owe)}
 S.bills.push(b);delete S.carts[S.ctx];if(S.type=='restaurant'&&S.ctx[0]=='T')S.ctx=S.ctx;cartR();tiles();showR(b,'INVOICE')}
function saveQ(){const c=C();if(!c.lines.length)return toast('The cart is empty');const q=bill(c,'quote','QT-'+pad(S.q++));S.quotes.push(q);delete S.carts[S.ctx];cartR();showR(q,'QUOTATION')}
function kot(){const c=C(),nl=c.lines.filter(l=>!(l.k>0));if(!nl.length)return alert('No new items to send.');nl.forEach(l=>l.k=1);cartR();
 modal(`<div class="receipt r-80" id="rc"><div class="rh"><b class="rn">KITCHEN ORDER</b><div>${E(S.ctx)} · ${pad(new Date().getHours(),2)}:${pad(new Date().getMinutes(),2)}</div></div><table style="width:100%">${nl.map(l=>`<tr><td><b>${l.qty} ×</b></td><td>${E(l.name)}</td></tr>`).join('')}</table></div><p style="text-align:center"><button class="btn" onclick="printR('80')">🖨 Print KOT</button> <button class="btn ghost" onclick="closeM()">Close</button></p>`)}
/* ---------- receipts ---------- */
function rcptHtml(b,ti,sz){const W=S.shop,Q=b.type=='quote',ws=b.lines.filter(l=>l.warr);
 return`<div class="receipt r-${sz}" id="rc"><div class="rh"><b class="rn">${E(W.name)}</b><div>${E(W.addr||'')}${W.phone?' · '+E(W.phone):''}</div><h4>${ti}</h4></div><div style="display:flex;justify-content:space-between"><span>No: ${b.no}</span><span>${b.date} ${b.time||''}</span></div>${b.cust?`<div>Customer: ${E(b.cust)} ${E(b.mob||'')}</div>`:''}${b.ctx&&b.ctx!='MAIN'?`<div>${E(b.ctx)}</div>`:''}
 <table style="width:100%;margin-top:6px"><tr><th align="left">Item</th><th>Qty</th><th align="right">Amount</th></tr>${b.lines.map(l=>`<tr><td>${E(l.name)}${l.ret?' (return)':''}${l.disc?` <small>−${l.disc}%</small>`:''}<br><small>${rs(l.price)}</small></td><td align="center">${l.qty}</td><td align="right">${rs(lt(l))}</td></tr>`).join('')}</table>
 <div class="rt"><div><span>Subtotal</span><span>${rs(b.sub)}</span></div>${b.da?`<div><span>Discount</span><span>- ${rs(b.da)}</span></div>`:''}${b.sv?`<div><span>Service charge</span><span>${rs(b.sv)}</span></div>`:''}<div><b>TOTAL</b><b>${rs(b.total)}</b></div>${!Q&&b.type=='sale'?`<div><span>Paid (${b.method})</span><span>${rs(b.paid)}</span></div>${b.paid>=b.total?`<div><span>Change</span><span>${rs(b.paid-b.total)}</span></div>`:`<div><span>Balance due</span><span>${rs(b.total-b.paid)}</span></div>`}`:''}</div>
 ${ws.length?`<div style="margin-top:6px;font-size:11px">${ws.map(l=>`Warranty: ${E(l.name)} ${l.warr} months`).join('<br>')}</div>`:''}<p style="text-align:center;margin:8px 0 0">${Q?'Valid for 14 days. ':''}Thank you!<br><small>Software by Nexus Logics</small></p></div>`}
function showR(b,ti){modal(`${rcptHtml(b,ti,'a5')}<p style="text-align:center"><select id="sz" style="width:auto" onchange="$('rc').className='receipt r-'+this.value" aria-label="Paper size"><option value="a5">A5</option><option value="a4">A4</option><option value="80">80mm roll</option></select> <button class="btn" onclick="printR($('sz').value)">🖨 Print</button> <button class="btn ghost" onclick="closeM()">Close</button></p>`)}
function printR(sz){$('ps').textContent=`@page{size:${sz=='80'?'80mm auto':sz.toUpperCase()};margin:${sz=='80'?'2mm':'10mm'}}`;window.print()}
/* ---------- stock / items ---------- */
function pStock(){const T=S.type,q=(HT.sq||'').toLowerCase(),x=T=='pharmacy'?'Expiry':T=='mobile'?'Warranty':T=='hardware'?'Unit':'';
 $('pg').innerHTML=`<div class="card"><div class="bar2"><input placeholder="Search items…" value="${E(HT.sq||'')}" oninput="HT.sq=this.value;stRows()"><button class="btn sm" onclick="editItem()">＋ Add item</button><button class="btn alt sm" onclick="addSec()">＋ Section</button></div>
 <div class="bar2" style="align-items:center"><b>Quick add stock:</b><input id="qc" placeholder="Short code" style="max-width:140px" onkeydown="if(event.key=='Enter')$('qq').focus()"><input id="qq" type="number" placeholder="Qty" style="max-width:100px" onkeydown="if(event.key=='Enter')quick()"><button class="btn alt sm" onclick="quick()">Add</button></div>
 <div class="tw"><table><thead><tr><th>Code</th><th>Item</th><th>Section</th><th class="r">Cost</th><th class="r">Margin</th><th class="r">Price</th><th class="r">Stock</th>${x?`<th>${x}</th>`:''}<th></th></tr></thead><tbody id="sr"></tbody></table></div>
 <p class="mut" id="sf"></p></div>`;stRows()}
function stRows(){const q=(HT.sq||'').toLowerCase(),L=S.items.filter(i=>!q||(i.name+i.code+i.barcode).toLowerCase().includes(q)),T=S.type;
 $('sr').innerHTML=L.map(i=>{const m=i.price?Math.round((i.price-i.cost)/i.price*100):0,d=dleft(i);return`<tr><td>${E(i.code)}</td><td><b>${E(i.name)}</b></td><td>${E(i.sec)}</td><td class="r">${rs(i.cost)}</td><td class="r">${m}%</td><td class="r">${rs(i.price)}</td><td class="r">${TRK(i)?`<span class="${i.stock<=10?'bad':''}">${i.stock}</span>`:'∞'}</td>
  ${T=='pharmacy'?`<td>${d<0?'<span class="tag r">Expired</span>':d<=90?`<span class="tag y">${i.exp}</span>`:i.exp}</td>`:T=='mobile'?`<td>${i.warr?i.warr+' mo':'-'}</td>`:T=='hardware'?`<td>${E(i.unit||'-')}</td>`:''}
  <td class="r" style="white-space:nowrap"><button class="btn ghost sm" onclick="editItem('${i.id}')">Edit</button> <button class="btn ghost sm" onclick="delItem('${i.id}')">✕</button></td></tr>`}).join('');
 const tr=S.items.filter(TRK);$('sf').textContent=S.items.length+' items · stock value (cost) '+rs(tr.reduce((a,i)=>a+i.stock*i.cost,0))}
function quick(){const c=$('qc').value.trim().toLowerCase(),q=+$('qq').value,it=S.items.find(i=>i.code.toLowerCase()==c||i.barcode==c);if(!it)return alert('Short code not found.');if(!(q>0))return;it.stock=r2(it.stock+q);toast(it.name+': stock '+it.stock);pStock()}
function addSec(){const n=(prompt('New section name')||'').trim();if(n&&!S.sections.includes(n)){S.sections.push(n);toast('Section added');pStock()}}
function delItem(id){if(confirm('Delete this item?')){S.items=S.items.filter(i=>i.id!=id);pStock()}}
function editItem(id){const T=S.type,it=id?S.items.find(i=>i.id==id):{name:'',sec:S.sections[0],price:'',cost:'',stock:'',barcode:'',exp:'',batch:'',warr:0,unit:''};
 modal(`<h3>${id?'Edit item':'Add item'}</h3><label>Name</label><input id="fn" value="${E(it.name)}"><div class="row2"><div><label>Section</label><select id="fs">${S.sections.map(s=>`<option ${s==it.sec?'selected':''}>${E(s)}</option>`).join('')}</select></div><div><label>Barcode (optional)</label><input id="fb" value="${E(it.barcode)}"></div></div>
 <div class="row2"><div><label>Cost price</label><input id="fc" type="number" min="0" value="${it.cost}" oninput="mg('c')"></div><div><label>Margin %</label><input id="fm" type="number" value="${it.price?Math.round((it.price-it.cost)/it.price*100):''}" oninput="mg('m')"></div></div>
 <div class="row2"><div><label>Selling price</label><input id="fp" type="number" min="0" value="${it.price}" oninput="mg('p')"></div><div><label>Stock</label><input id="fq" type="number" min="0" value="${it.stock}"></div></div>
 ${T=='pharmacy'?`<div class="row2"><div><label>Expiry date</label><input id="fe" type="date" value="${it.exp}"></div><div><label>Batch no</label><input id="fh" value="${E(it.batch)}"></div></div>`:T=='mobile'?`<label>Warranty (months)</label><input id="fw" type="number" min="0" value="${it.warr}">`:T=='hardware'?`<label>Unit (bag, m, kg…)</label><input id="fu" value="${E(it.unit)}">`:''}
 <p><button class="btn" onclick="saveItem('${id||''}')">Save</button> <button class="btn ghost" onclick="closeM()">Cancel</button></p>`)}
function mg(w){const c=+$('fc').value,p=+$('fp').value,m=+$('fm').value;if(w=='m'&&m<100&&c)$('fp').value=Math.round(c/(1-m/100));else if(c&&p)$('fm').value=Math.round((p-c)/p*100)}
function saveItem(id){const n=$('fn').value.trim(),p=+$('fp').value;if(!n||!(p>=0))return alert('Enter a name and selling price.');const T=S.type,o=id?S.items.find(i=>i.id==id):{id:TY[T].p+'x'+(S.n++)+Date.now()%1000,code:'',barcode:''};
 Object.assign(o,{name:n,sec:$('fs').value,price:p,cost:+$('fc').value||0,stock:$('fq').value===''?0:+$('fq').value,barcode:$('fb').value.trim()});
 if(T=='pharmacy'){o.exp=$('fe').value;o.batch=$('fh').value}if(T=='mobile')o.warr=+$('fw').value||0;if(T=='hardware')o.unit=$('fu').value.trim();
 if(!id){o.code=TY[T].p+pad(S.items.length+1,2);S.items.push(o)}closeM();pStock()}
/* ---------- history ---------- */
function pHist(){const q=HF.q.toLowerCase();let L=S.bills.filter(b=>b.date>=HF.f&&b.date<=HF.t&&(!q||(b.no+b.cust+b.mob).toLowerCase().includes(q))).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
 $('pg').innerHTML=`<div class="card"><div class="bar2"><input type="date" value="${HF.f}" onchange="HF.f=this.value;pHist()" style="max-width:160px"><input type="date" value="${HF.t}" onchange="HF.t=this.value;pHist()" style="max-width:160px"><input placeholder="Bill no / customer / mobile" value="${E(HF.q)}" onchange="HF.q=this.value;pHist()"></div>
 <div class="tw"><table><thead><tr><th>Bill</th><th>Date</th><th>Customer</th><th>Pay</th><th class="r">Total</th><th></th></tr></thead><tbody>${L.map(b=>`<tr><td><b>${b.no}</b> ${b.type=='return'?'<span class="tag r">return</span>':''}</td><td>${b.date} ${b.time||''}</td><td>${E(b.cust)||'<span class="mut">Walk-in</span>'}</td><td>${b.method}</td><td class="r">${rs(b.total)}</td>
 <td class="r" style="white-space:nowrap"><button class="btn ghost sm" onclick="hv('${b.no}')">View</button> ${b.type=='sale'?`<button class="btn ghost sm" onclick="hx('${b.no}')">Extra disc.</button> <button class="btn ghost sm" onclick="hr('${b.no}')">Return</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">No bills in this range.</td></tr>'}</tbody></table></div></div>`}
const gb=no=>S.bills.find(b=>b.no==no);
function hv(no){const b=gb(no);showR(b,b.type=='return'?'RETURN NOTE':'INVOICE')}
function hx(no){const b=gb(no),v=+prompt('Extra discount to give on '+no+' (Rs.)','0');if(!(v>0)||v>b.total)return;b.da=r2(b.da+v);b.total=r2(b.total-v);b.profit=r2(b.profit-v);b.paid=Math.min(b.paid,b.total);toast('Discount applied');pHist()}
function hr(no){const b=gb(no);modal(`<h3>Return items from ${no}</h3>${b.lines.map((l,i)=>`<div class="ln"><span>${E(l.name)} <span class="mut">(sold ${l.qty})</span></span><input id="rq${i}" type="number" min="0" max="${l.qty}" value="0" style="width:80px"></div>`).join('')}<p><button class="btn" onclick="hrOk('${no}')">Create return</button> <button class="btn ghost" onclick="closeM()">Cancel</button></p>`)}
function hrOk(no){const b=gb(no),ls=[];b.lines.forEach((l,i)=>{const q=Math.min(l.qty,+$('rq'+i).value||0);if(q>0)ls.push({...l,qty:q,ret:1})});if(!ls.length)return;const c={lines:ls,dt:'%',dv:0,svc:0,cust:b.cust,mob:b.mob,method:'Cash'},r=bill(c,'return','RET-'+pad(S.n++));r.paid=r.total;r.ctx=b.ctx;
 ls.forEach(l=>{const it=S.items.find(i=>i.id==l.id);if(it&&TRK(it))it.stock=r2(it.stock+l.qty)});S.bills.push(r);closeM();pHist();showR(r,'RETURN NOTE')}
/* ---------- reports ---------- */
function pRep(){const t=ld(),[f,to]=RG.m=='today'?[t,t]:RG.m=='week'?[ago(6),t]:RG.m=='month'?[t.slice(0,8)+'01',t]:[RG.f,RG.t];
 const L=S.bills.filter(b=>b.date>=f&&b.date<=to),sales=L.reduce((a,b)=>a+b.total,0),pr=L.reduce((a,b)=>a+b.profit,0),nb=L.filter(b=>b.type=='sale').length;
 const days={};L.forEach(b=>days[b.date]=(days[b.date]||0)+b.total);const pm={};L.forEach(b=>pm[b.method]=(pm[b.method]||0)+b.total);
 const fm={};L.forEach(b=>b.lines.forEach(l=>{if(!l.reload)fm[l.name]=(fm[l.name]||0)+(l.ret?-1:1)*l.qty}));const fl=Object.entries(fm).sort((a,b)=>b[1]-a[1]).slice(0,8);
 const tr=S.items.filter(TRK),units=tr.reduce((a,i)=>a+i.stock,0),cv=tr.reduce((a,i)=>a+i.stock*i.cost,0),sv=tr.reduce((a,i)=>a+i.stock*i.price,0);
 $('pg').innerHTML=`<div class="card"><div class="bar2">${[['today','Today'],['week','Last 7 days'],['month','This month'],['custom','Custom']].map(m=>`<button class="btn ${RG.m==m[0]?'':'ghost'} sm" onclick="RG.m='${m[0]}';pRep()">${m[1]}</button>`).join('')}${RG.m=='custom'?`<input type="date" value="${RG.f}" onchange="RG.f=this.value;pRep()" style="max-width:150px"><input type="date" value="${RG.t}" onchange="RG.t=this.value;pRep()" style="max-width:150px">`:''}</div>
 <div class="grid4"><div class="card kpi"><small>Sales</small><div>${rs(sales)}</div></div><div class="card kpi"><small>Profit</small><div>${rs(pr)}</div></div><div class="card kpi"><small>Bills</small><div>${nb}</div></div><div class="card kpi"><small>Average bill</small><div>${rs(nb?sales/nb:0)}</div></div></div>
 <div class="two"><div class="card"><h3>By day</h3>${Object.entries(days).sort().map(d=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)"><span>${d[0]}</span><b>${rs(d[1])}</b></div>`).join('')||'<span class="mut">No sales</span>'}<h3 style="margin-top:12px">Payment methods</h3>${Object.entries(pm).map(d=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${d[0]}</span><b>${rs(d[1])}</b></div>`).join('')}</div>
 <div class="card"><h3>${S.type=='restaurant'?'Best sellers':'Fast moving items'}</h3>${fl.map(d=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)"><span>${E(d[0])}</span><b>${d[1]}</b></div>`).join('')||'<span class="mut">No sales</span>'}</div></div>
 <div class="card"><h3>Full stock report</h3><div class="grid4" style="margin:8px 0 0"><div class="card kpi"><small>Total units</small><div>${units}</div></div><div class="card kpi"><small>Money spent on stock</small><div>${rs(cv)}</div></div><div class="card kpi"><small>Stock worth (selling)</small><div>${rs(sv)}</div></div><div class="card kpi"><small>Profit if all sells</small><div>${rs(sv-cv)}</div></div></div></div></div>`}
/* ---------- quotes / credit / expiry / tables / kitchen ---------- */
function pQuote(){$('pg').innerHTML=`<div class="card"><p class="mut">Build a quotation from the Billing screen using “Save as quotation”. Quotations are valid for 14 days.</p><div class="tw"><table><thead><tr><th>No</th><th>Date</th><th>Customer</th><th class="r">Total</th><th></th></tr></thead><tbody>${[...S.quotes].reverse().map(q=>`<tr><td><b>${q.no}</b></td><td>${q.date}</td><td>${E(q.cust)||'-'}</td><td class="r">${rs(q.total)}</td><td class="r" style="white-space:nowrap"><button class="btn ghost sm" onclick="qv('${q.no}')">View</button> <button class="btn ghost sm" onclick="qb('${q.no}')">Make bill</button> <button class="btn ghost sm" onclick="S.quotes=S.quotes.filter(x=>x.no!='${q.no}');pQuote()">✕</button></td></tr>`).join('')||'<tr><td colspan="5" class="mut">No quotations.</td></tr>'}</tbody></table></div></div>`}
function qv(no){showR(S.quotes.find(q=>q.no==no),'QUOTATION')}
function qb(no){const q=S.quotes.find(x=>x.no==no);S.ctx='MAIN';S.carts.MAIN={...newCart('MAIN'),lines:q.lines.map(l=>({...l})),cust:q.cust,mob:q.mob};go('pos')}
function pCust(){$('pg').innerHTML=`<div class="card"><div class="tw"><table><thead><tr><th>Customer</th><th>Mobile</th><th class="r">Credit owed</th><th></th></tr></thead><tbody>${S.customers.map((u,i)=>`<tr><td><b>${E(u.name)}</b></td><td>${E(u.mob)}</td><td class="r ${u.credit?'bad':''}">${rs(u.credit)}</td><td class="r"><button class="btn ghost sm" onclick="rcv(${i})">Receive payment</button></td></tr>`).join('')||'<tr><td colspan="4" class="mut">No customers yet.</td></tr>'}</tbody></table></div></div>`}
function rcv(i){const u=S.customers[i],v=+prompt('Payment received from '+u.name+' (Rs.)',u.credit);if(v>0){u.credit=Math.max(0,r2(u.credit-v));toast('Payment recorded');pCust()}}
function pExp(){const f=HT.ef||'all',L=S.items.filter(i=>i.exp).filter(i=>f=='all'||(f=='exp'&&dleft(i)<0)||(f=='30'&&dleft(i)>=0&&dleft(i)<=30)||(f=='90'&&dleft(i)<=90)).sort((a,b)=>a.exp.localeCompare(b.exp)),risk=S.items.filter(i=>i.exp&&dleft(i)<=90).reduce((a,i)=>a+i.stock*i.cost,0);
 $('pg').innerHTML=`<div class="card"><div class="bar2">${[['all','All'],['exp','Expired'],['30','Within 30 days'],['90','Within 90 days']].map(m=>`<button class="btn ${f==m[0]?'':'ghost'} sm" onclick="HT.ef='${m[0]}';pExp()">${m[1]}</button>`).join('')}</div><p>Stock cost at risk (expired or expiring within 90 days): <b class="bad">${rs(risk)}</b></p>
 <div class="tw"><table><thead><tr><th>Item</th><th>Batch</th><th>Expiry</th><th>Status</th><th class="r">Stock</th><th></th></tr></thead><tbody>${L.map(i=>{const d=dleft(i);return`<tr><td><b>${E(i.name)}</b></td><td>${E(i.batch)}</td><td>${i.exp}</td><td>${d<0?'<span class="tag r">Expired</span>':d<=30?`<span class="tag r">${d} days</span>`:d<=90?`<span class="tag y">${d} days</span>`:'<span class="tag g">OK</span>'}</td><td class="r">${i.stock}</td><td class="r">${d<0&&i.stock?`<button class="btn ghost sm" onclick="wo('${i.id}')">Write off</button>`:''}</td></tr>`}).join('')}</tbody></table></div></div>`}
function wo(id){S.items.find(i=>i.id==id).stock=0;toast('Written off');pExp()}
function ctxs(){return[...Array(10)].map((_,i)=>'T'+(i+1)).concat(['Takeaway','Delivery'])}
function pTbl(){$('pg').innerHTML=`<p class="mut">Tap a table to open or start its order.</p><div class="tbg">${ctxs().map(x=>{const c=S.carts[x],occ=c&&c.lines.length,t=occ?calc(c).tot:0;return`<button class="tb ${occ?'occ':''}" onclick="S.ctx='${x}';go('pos')">${x[0]=='T'&&x.length<4?'🍽️ Table '+x.slice(1):(x=='Takeaway'?'🥡 Takeaway':'🛵 Delivery')}<small>${occ?c.lines.length+' items · '+rs(t):'Free'}</small></button>`}).join('')}</div>`}
function pKit(){const L=Object.entries(S.carts).filter(([k,c])=>c.lines.some(l=>l.k==1||l.k==2));
 $('pg').innerHTML=L.length?`<div class="grid4">${L.map(([k,c])=>`<div class="card"><h3>${k[0]=='T'&&k.length<4?'Table '+k.slice(1):k}</h3>${c.lines.map((l,i)=>l.k==1||l.k==2?`<div class="ln"><span><b>${l.qty} ×</b> ${E(l.name)}</span>${l.k==1?`<button class="btn sm ok" onclick="kst('${k}',${i},2)">Ready</button>`:`<button class="btn sm alt" onclick="kst('${k}',${i},3)">Served</button>`}</div>`:'').join('')}</div>`).join('')}</div>`:'<div class="card mut">No orders in the kitchen. Send items from an order using “Send to kitchen (KOT)”.</div>'}
function kst(k,i,v){S.carts[k].lines[i].k=v;pKit()}
home();
</script></body></html>

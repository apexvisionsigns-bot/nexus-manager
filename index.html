<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexus Logics Manager</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#6d2fc0"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Nexus">
<style>
:root{--ac:#6d2fc0;--m:#c23b86;--o:#ff6a1a;--bg:#f5f3fa;--ink:#1b1535;--mut:#6b6485;--line:#e3ddf2;--card:#fff;--bad:#d6336c;--ok:#1e9e6a;--navy:#150f2b;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,"Noto Sans Sinhala","Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 4px}
button{border:0;border-radius:10px;min-height:40px;padding:9px 15px;background:var(--ac);color:#fff;cursor:pointer;font-weight:700}
button.o{background:var(--o)}button.g{background:#fff;color:var(--ac);border:1.5px solid var(--ac)}button.x{background:var(--bad)}button.s{padding:5px 11px;font-size:13px;min-height:34px}
:focus-visible{outline:3px solid var(--o);outline-offset:1px}
a{color:var(--ac)}h2,h3{margin:0 0 8px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 80% 10%,#3a1b8c,#150f2b 55%,#110a2c)}
.lc{background:#fff;border-radius:20px;padding:26px;max-width:400px;width:100%;text-align:center}.lc img{width:210px;border-radius:12px}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:#fff;padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px}
.side img{width:150px;border-radius:12px;margin:0 8px 10px;background:#fff;padding:6px}
.nv{display:block;width:100%;background:transparent;color:#d9d2f2;text-align:left;padding:11px 12px;font-weight:600}.nv.on{background:var(--ac);color:#fff}
.side small{color:#a79fc9;padding:8px 12px}
.main{padding:18px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:#ece4fa;color:var(--ac);border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}.kp .card{margin:0}.kp strong{font-size:28px;display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:120px}.row>button,.row>a{flex:none}
.sp{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}.bad{color:var(--bad);font-weight:700}.ok{color:var(--ok);font-weight:700}
.ln{padding:8px 0;border-bottom:1px solid var(--line)}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.ph img{height:84px;border-radius:8px;border:1px solid var(--line)}
.th{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#ece4fa}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px}.bars div{flex:1;text-align:center;font-size:12px}.bars i{display:block;background:linear-gradient(var(--m),var(--ac));border-radius:5px 5px 0 0;min-height:3px}
.it{display:grid;grid-template-columns:1fr 60px 100px 32px;gap:4px;margin-bottom:4px}.it button{padding:0}
.ps{display:grid;grid-template-columns:1fr 1fr 1fr 32px;gap:4px;margin-bottom:4px}.ps button{padding:0}
.sheet{background:#fff;color:#111;padding:22px;border-radius:12px;border:1px solid var(--line);font-size:13px}
.sheet .hd{flex-wrap:wrap;display:flex;justify-content:space-between;gap:10px;border-bottom:4px solid var(--ac);padding-bottom:8px;margin-bottom:10px}
.sheet img{height:80px}.sheet table{width:100%;border-collapse:collapse;margin-top:8px}
.sheet th{background:var(--ac);color:#fff;text-align:left;padding:6px}.sheet td{padding:6px;border-bottom:1px solid #ddd}.r{text-align:right}
.sheet .tt{margin-left:auto;width:260px;margin-top:8px}.sheet .tt div{display:flex;justify-content:space-between;padding:2px 0}
.sheet .terms{margin-top:14px;font-size:12px;border-left:4px solid var(--m);padding-left:8px;white-space:pre-line}
.tw{overflow-x:auto}
.hero{background:linear-gradient(120deg,#a8176f,#6d2fc0 62%,#ff6a1a);color:#fff;border-radius:16px;padding:18px;margin-bottom:12px}.hero h2{margin:0 0 4px;font-size:23px}.hero .ab{opacity:.93;white-space:pre-line}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{background:#ffffff2e;color:#fff;border:1px solid #ffffff66;border-radius:99px;padding:6px 13px;text-decoration:none;font-weight:600;font-size:13.5px}
.kp .card.ag{border-left:5px solid var(--o);background:#fff7f0}.kp small{color:var(--mut);font-weight:600;display:block}.kp .card strong.sm{font-size:19px}
.tl{border-left:3px solid var(--ac);margin-left:6px;padding-left:14px}.tl>div{margin-bottom:12px;position:relative}.tl>div:before{content:'';position:absolute;left:-21px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--o)}.mb{display:none}
@media(max-width:760px){.shell{display:block}.side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:9;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px #0004}
.side img,.side small,.dk,.side span{display:none}.nv{flex:1;text-align:center;padding:10px 2px;font-size:11px;min-height:44px}
.main{padding:12px 12px calc(84px + env(safe-area-inset-bottom,0px));padding-top:calc(12px + env(safe-area-inset-top,0px))}.mb{display:flex;gap:6px}
.ps{grid-template-columns:1fr 1fr}.ps button{min-height:40px}.it{grid-template-columns:1fr 54px 84px 36px}.card{padding:12px}.sheet{padding:12px;font-size:12px}.sheet .tt{width:100%}.sheet img{height:56px}}
@media print{body *{visibility:hidden}.sheet,.sheet *{visibility:visible}.sheet{position:absolute;left:0;top:0;width:100%;border:0}@page{margin:10mm}}
</style></head><body>

function apply(w,m){const kind=w.kind,id=w.id.slice(kind.length+1),c=m.get(w.id);if(c&&SN[w.id]!==c.hh)return 0;

 if(kind=='price'){if(w.deleted){delete S.pp[id];delete SN[w.id];return 1}S.pp[id]=d.p;const e=S.eq.find(x=>x.id==id);if(e)e.p=d.p;SN[w.id]=hs(JSON.stringify({p:+d.p||0}));return 1}

 let o=d;if(kind=='eq'){o={id:d.id,n:d.n,img:d.img||''};const p=i>=0?arr[i].p:S.pp[id];if(p!==undefined)o.p=p;SN[w.id]=hs(JSON.stringify({id:o.id,n:o.n,img:o.img}))}else SN[w.id]=hs(JSON.stringify(o));

async function pull(){if(!me||pulling)return;pulling=1;try{let ch=0,more=1,n=0,good=1;const m=recs();

function pv(){const s=S.shops.find(x=>x.id==doc.shop)||{name:'',phones:[]},c=tot(doc),b=doc.type=='bill';
 $('sh').innerHTML=`<div class="hd"><div><img src="${LOGO}" alt="Nexus Logics"><div>138/A, Sirikalum, Danture<br>+94 76 099 6789 · nexuslogics.com</div></div><div class="r"><h2 style="margin:0;color:#6d2fc0">${b?'INVOICE':'QUOTATION'}</h2>No: ${doc.no}<br>${doc.date}</div></div>
 <b>${t('billto')}</b><br>${E(s.name)}<br>${E(s.phones[0]||'')}<div class="tw"><table><tr><th>#</th><th>${t('item')}</th><th class="r">${t('qty')}</th><th class="r">${t('price')}</th><th class="r">Total</th></tr>${doc.items.map((i,k)=>`<tr><td>${k+1}</td><td>${E(i.d)}</td><td class="r">${i.q}</td><td class="r">${rs(i.p)}</td><td class="r">${rs(i.q*i.p)}</td></tr>`).join('')}</table></div>
 <div class="tt"><div><span>${t('sub')}</span><span>${rs(c.s)}</span></div>${doc.disc?`<div><span>${t('disc')}</span><span>-${rs(doc.disc)}</span></div>`:''}<div><b>${t('total')}</b><b>${rs(c.t)}</b></div>${b?`<div><span>${t('paidT')}</span><span>${rs(c.p)}</span></div><div><b>${t('bal')}</b><b>${rs(c.b)}</b></div>`:''}</div>
 ${b&&doc.pays.length?`<div class="tw"><table><tr><th>${t('dueD')}</th><th class="r">${t('amt')}</th><th>${t('paidOn')}</th></tr>${doc.pays.map(p=>`<tr><td>${p.due}</td><td class="r">${rs(p.amt)}</td><td>${p.paid||'-'}</td></tr>`).join('')}</table></div>`:''}
 ${b?'':`<div class="terms">${E(S.terms)}</div>`}<div class="sp" style="margin-top:40px"><span>${t('sign')}</span><span>${t('cust')}</span></div>`}
function fs(){if(doc.fresh){delete doc.fresh;S.docs.push(doc)}save()}
function srv(){$('v').innerHTML=`<div class="card"><div class="row"><div><label>${t('shop')}</label><select id="sh1">${S.shops.map(s=>`<option value="${s.id}">${E(s.name)}</option>`).join('')}</select></div><div><label>${t('sv1')}</label><input id="sn1"></div><div><label>${t('amt')}</label><input id="sa" type="number" min="0"></div>
 <div><label>${t('dueD')}</label><input id="sd1" type="date" value="${ld()}"></div><div><label>${t('every')}</label><select id="se"><option value="month">${t('month')}</option><option value="year">${t('year')}</option><option value="once">${t('once')}</option></select></div><button class="o" onclick="as()">${t('addsv')}</button></div></div>
 <div class="card">${S.srv.map(x=>`<div class="ln sp"><div><b>${E((S.shops.find(s=>s.id==x.shop)||{}).name||'')}</b> · ${E(x.name)}<div class="${x.due<ld()?'bad':'mut'}">${x.due} · ${rs(x.amt)} · ${t(x.every)}</div></div><div class="row"><button class="s o" onclick="payS('${x.id}')">${t('markpaid')}</button><button class="s x" onclick="S.srv=S.srv.filter(s=>s.id!='${x.id}');save();draw()">×</button></div></div>`).join('')||`<p class="mut">${t('none')}</p>`}</div>`}
function as(){if(!$('sh1').value||!$('sn1').value.trim())return;S.srv.push({id:uid(),shop:$('sh1').value,name:$('sn1').value.trim(),amt:+$('sa').value||0,due:$('sd1').value,every:$('se').value});save();draw()}
function set(){const a=isA();$('v').innerHTML=`<div class="card"><h3>${t('chpw')}</h3><label for="np">${t('npw')}</label><input id="np" type="password" autocomplete="new-password"><p><button onclick="cpw()">${t('save')}</button></p></div>
 ${a?`<div class="card"><h3>${t('stf')}</h3><div id="sl"></div><div class="row" style="margin-top:8px"><div><label for="an">${t('name')}</label><input id="an"></div><div><label for="ae">${t('email')}</label><input id="ae" type="email"></div><div><label for="ap">${t('pw')}</label><input id="ap" type="text" autocomplete="off"></div>
 <div><label for="ar">${t('role')}</label><select id="ar"><option value="staff">${t('staff')}</option><option value="admin">${t('adm')}</option></select></div><button class="o" onclick="addStaff()">${t('addst')}</button></div></div>
 <div class="card"><label>${t('terms')}</label><textarea id="tm" rows="4">${E(S.terms)}</textarea><p><button onclick="S.terms=$('tm').value;save();alert(t('saved'))">${t('save')}</button></p></div>`:''}
 <div class="card"><p class="mut">${t('sstat')||'Sync'}: <b>${stat=='ok'&&lastSync?t('sy')+' '+lastSync.toLocaleTimeString():stat=='err'?t('se2'):'…'}</b></p>${a?`<div class="row"><button onclick="bk()">${t('bk')}</button><button class="g" onclick="$('rf').click()">${t('rs')}</button><input id="rf" type="file" accept=".json" hidden onchange="rst(event)"></div>`:''}</div>`;if(a)loadStaff()}
async function cpw(){const p=$('np').value;if(p.length<6)return alert(t('npw'));const r=await rpc('password',{password:p});if(r.ok){$('np').value='';alert(t('pwok'))}else alert(r.d.error||'Error')}
async function loadStaff(){const r=await rpc('staffList'),rows=r.ok?r.d.rows:[];if(!$('sl'))return;
 $('sl').innerHTML=rows.map(u=>`<div class="ln row" style="align-items:center"><div><b>${E(u.name)}</b><div class="mut">${E(u.email)}</div></div><select style="max-width:120px" onchange="setRole('${E(u.email)}',this.value)"><option value="staff" ${u.role=='staff'?'selected':''}>${t('staff')}</option><option value="admin" ${u.role=='admin'?'selected':''}>${t('adm')}</option></select>${u.email==me.email?'':`<button class="s x" onclick="delStaff('${E(u.email)}')">×</button>`}</div>`).join('')}
async function setRole(em,ro){const r=await rpc('staffRole',{email:em,role:ro});if(!r.ok)alert(r.d.error||'Error');loadStaff()}
async function delStaff(em){if(!confirm(t('cf')))return;const r=await rpc('staffDel',{email:em});if(!r.ok)alert(r.d.error||'Error');loadStaff()}
async function addStaff(){const n=$('an').value.trim(),em=$('ae').value.trim().toLowerCase(),pw=$('ap').value,ro=$('ar').value;if(!em||pw.length<6)return alert(t('npw'));
 const r=await rpc('staffAdd',{name:n,email:em,password:pw,role:ro});if(!r.ok)return alert(r.d.error||'Error');$('an').value=$('ae').value=$('ap').value='';loadStaff()}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='nexus-backup-'+ld()+'.json';a.click()}
function rst(e){const f=e.target.files[0];if(!f)return;f.text().then(x=>{try{const d=JSON.parse(x);if(!d.shops)throw 0;S=Object.assign(def(),d,{lang:S.lang});save();draw();sync()}catch(_){alert('Invalid file')}})}
draw();if(me)sync();setInterval(sync,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
